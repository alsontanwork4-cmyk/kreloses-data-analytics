<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <link href="/Content/bootstrap.css?v=SYNTHETIC" rel="stylesheet"/>
</head>
<body class="login-page">
    <div class="container body-content">
        <div class="row">
            <div class="col-md-4 col-md-offset-4">
                <h2>Log in</h2>
<form action="/account/login" class="form-horizontal" method="post" role="form"><input name="__RequestVerificationToken" type="hidden" value="SYNTHETIC-FORM-TOKEN-7f3a9c1e2b4d&#x2B;Qw==" />                    <h4>Use your Kreloses account to log in.</h4>
                    <hr />
                    <div class="validation-summary-errors text-danger" data-valmsg-summary="true"><ul><li>Invalid login attempt.</li>
</ul></div>
                    <div class="form-group">
                        <label class="col-md-3 control-label" for="Email">Email</label>
                        <div class="col-md-9">
                            <input class="form-control" data-val="true" data-val-email="The Email field is not a valid e-mail address." data-val-required="The Email field is required." id="Email" name="Email" type="text" value="synthetic.user@example.test" />
                            <span class="field-validation-valid text-danger" data-valmsg-for="Email" data-valmsg-replace="true"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-md-3 control-label" for="Password">Password</label>
                        <div class="col-md-9">
                            <input class="form-control" data-val="true" data-val-required="The Password field is required." id="Password" name="Password" type="password" />
                            <span class="field-validation-valid text-danger" data-valmsg-for="Password" data-valmsg-replace="true"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-md-offset-3 col-md-9">
                            <div class="checkbox">
                                <input data-val="true" data-val-required="The Remember me? field is required." id="RememberMe" name="RememberMe" type="checkbox" value="true" /><input name="RememberMe" type="hidden" value="false" />
                                <label for="RememberMe">Remember me?</label>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="ReturnUrl" value="" />
                    <div class="form-group">
                        <div class="col-md-offset-3 col-md-9">
                            <input type="submit" value="Log in" class="btn btn-primary" />
                        </div>
                    </div>
</form>            </div>
        </div>
    </div>
